<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Interactive Tumor Segmentation Test</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: #0f1115;
      color: #dce2e8;
      font: 14px/1.4 system-ui, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: nowrap;
      flex-shrink: 0;
      overflow-x: auto;
      white-space: nowrap;
      padding: 10px 14px;
      background: #171b21;
      border-bottom: 1px solid #2b323b;
    }
    header > * { flex-shrink: 0; }
    h1 { margin: 0; font-size: 15px; font-weight: 650; }
    .badge {
      padding: 2px 7px;
      border: 1px solid #805f25;
      border-radius: 999px;
      color: #ffd98a;
      background: #302610;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    form { display: flex; gap: 7px; align-items: center; flex: 1; min-width: 340px; }
    label { color: #98a3ae; font-size: 12px; }
    input {
      flex: 1;
      min-width: 220px;
      padding: 6px 8px;
      border: 1px solid #3b4652;
      border-radius: 5px;
      background: #0e1115;
      color: #e7edf3;
    }
    button {
      padding: 6px 10px;
      border: 1px solid #466176;
      border-radius: 5px;
      background: #1c3344;
      color: #dff1ff;
      cursor: pointer;
    }
    button:hover { background: #25455c; }
    #health { width: 190px; overflow: hidden; text-overflow: ellipsis; color: #98a3ae; font-size: 12px; }
    #health.ok { color: #8be09b; }
    #health.bad { color: #ff9898; }
    #viewer { flex: 1; width: 100%; border: 0; background: #111; }
    footer {
      padding: 5px 14px;
      background: #12151a;
      border-top: 1px solid #252b33;
      color: #77828d;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Seeded tumor segmentation</h1>
    <span class="badge">development test</span>
    <form id="endpoint-form">
      <label for="endpoint">Inference API</label>
      <input id="endpoint" type="url" spellcheck="false" required />
      <button type="submit">Connect</button>
    </form>
    <span id="health">Not checked</span>
  </header>

  <iframe id="viewer" title="Interactive breast MRI tumor segmentation viewer"></iframe>

  <footer>
    <a href="https://michaelzenkay.com/tumor-seg-demo.html" target="_blank" rel="noopener" style="color:#9ed7ff">Open saved demo (no live GPU required)</a> |
    Public I-SPY research data only. Development endpoint; not for clinical use. Endpoint choice is stored only in this browser.
  </footer>

  <script>
    const DEFAULT_LOCAL_API = "http://127.0.0.1:8081";
    const STORAGE_KEY = "tumor-intseg-local-seed-api";
    const endpointInput = document.getElementById("endpoint");
    const health = document.getElementById("health");
    const viewer = document.getElementById("viewer");

    function normalizedEndpoint(value) {
      return value.trim().replace(/\/+$/, "");
    }

    function loadViewer(endpoint) {
      const url = new URL("tumor-seg-demo.html", window.location.href);
      url.searchParams.set("api", endpoint);
      url.searchParams.set("backend", "local-seed");
      viewer.src = url.href;
    }

    async function checkHealth(endpoint) {
      const started = performance.now();
      health.className = "";
      health.textContent = "Checking backend…";
      try {
        const response = await fetch(`${endpoint}/health`, { cache: "no-store", signal: AbortSignal.timeout(4000) });
        if (endpoint !== normalizedEndpoint(endpointInput.value)) return;
        const elapsed = performance.now() - started;
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const body = await response.json().catch(() => ({}));
        if (body.state === 'paused') {
          health.className = '';
          health.textContent = 'Live GPU paused; saved demo available';
          return;
        }
        if (body.ready === false || body.model_loaded === false) throw new Error('Backend has no ready model/cases');
        const device = body.state === 'busy' ? `GPU busy (${body.queued} waiting)` : 'Live GPU available';
        health.className = "ok";
        health.textContent = `${device} · ${elapsed.toFixed(0)} ms health RTT`;
      } catch (error) {
        health.className = "bad";
        health.textContent = `Offline · ${error.message}`;
      }
    }

    new MutationObserver(() => { health.title = health.textContent; }).observe(health, {childList: true});

    function connect(rawEndpoint) {
      const endpoint = normalizedEndpoint(rawEndpoint);
      endpointInput.value = endpoint;
      localStorage.setItem(STORAGE_KEY, endpoint);
      loadViewer(endpoint);
      checkHealth(endpoint);
    }

    document.getElementById("endpoint-form").addEventListener("submit", (event) => {
      event.preventDefault();
      connect(endpointInput.value);
    });

    endpointInput.value = new URLSearchParams(location.search).get('same_origin') === '1'
      ? window.location.origin : (localStorage.getItem(STORAGE_KEY) || DEFAULT_LOCAL_API);
    connect(endpointInput.value);
    setInterval(() => checkHealth(normalizedEndpoint(endpointInput.value)), 15000);
  </script>
</body>
</html>
